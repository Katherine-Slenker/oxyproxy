on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: test-coverage

# Runs for a PR share one group, so a new push cancels that PR's in-flight run.
# Every other run is grouped by its commit, so no run on main is cancelled or
# dropped from the queue by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      # package_coverage() runs the test suite and errors if any test fails,
      # so this step is also the test gate.
      - name: Compute coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          print(cov)

          summary <- covr::coverage_to_list(cov)
          lines <- c(
            sprintf("### Test coverage: %.1f%%", summary$totalcoverage),
            "",
            "| File | Coverage |",
            "|---|---|"
          )
          file_cov <- summary$filecoverage
          for (f in names(file_cov)[order(file_cov)]) {
            lines <- c(lines, sprintf("| %s | %.1f%% |", f, file_cov[[f]]))
          }
          writeLines(lines, Sys.getenv("GITHUB_STEP_SUMMARY"))
