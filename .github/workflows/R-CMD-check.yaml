# Standard multi-platform check, per r-lib/actions and R Packages (2e).
# Pull requests check ubuntu-latest (release) only; pushes to main and manual
# runs check the full five-platform matrix.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

# Runs for a PR share one group, so a new push cancels that PR's in-flight run.
# Every other run is grouped by its commit, so no run on main is cancelled or
# dropped from the queue by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"os": "ubuntu-latest", "r": "release"}]'
          || '[{"os": "macos-latest", "r": "release"},
          {"os": "windows-latest", "r": "release"},
          {"os": "ubuntu-latest", "r": "devel", "http-user-agent": "release"},
          {"os": "ubuntu-latest", "r": "release"},
          {"os": "ubuntu-latest", "r": "oldrel-1"}]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
